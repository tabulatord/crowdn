<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="description" content="CROWDN — Couronné par la Foule. La nouvelle référence du live." />
    
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CROWDN" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="CROWDN — Couronné par la Foule" />
    <meta property="og:description" content="La nouvelle référence du live." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://crowdn.fr" />
    
    <title>CROWDN</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Enregistrement du Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('CROWDN SW actif:', reg.scope))
            .catch(err => console.log('SW erreur:', err));
        });
      }
    </script>
  </body>
</html>
